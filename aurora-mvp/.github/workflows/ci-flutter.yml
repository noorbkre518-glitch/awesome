name: ci-flutter
on:
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/ci-flutter.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**']
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable' }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable' }
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-windows-build
          path: apps/mobile/build/windows/x64/runner/Release/
