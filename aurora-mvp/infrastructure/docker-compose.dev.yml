services:
  db:
    image: postgres:16-alpine
    container_name: aurora-db-dev
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
      POSTGRES_DB: aurora
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - aurora_db_data:/var/lib/postgresql/data
volumes:
  aurora_db_data:
